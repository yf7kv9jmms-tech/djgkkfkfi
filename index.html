<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TERMINAL://GAMES_LAUNCHER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

    :root {
      --glow-green: #00ff41;
      --dark-green: #003b00;
      --bg-black: #050505;
      --terminal-font: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      cursor: crosshair;
    }

    html, body {
      margin: 0;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--glow-green);
      font-family: var(--terminal-font);
      overflow: hidden;
    }

    /* --- CRT SCANLINE EFFECT --- */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
      z-index: 100;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      opacity: 0.4;
    }

    /* --- MAIN APP CONTAINER --- */
    .app-container {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1; /* Set to 1 so it's visible immediately */
    }

    .terminal-window {
      width: min(900px, 95vw);
      background: rgba(0, 20, 0, 0.85);
      border: 2px solid var(--glow-green);
      box-shadow: 0 0 20px var(--dark-green), inset 0 0 10px var(--dark-green);
      padding: 30px;
      position: relative;
    }

    .header {
      border-bottom: 2px solid var(--glow-green);
      margin-bottom: 30px;
      padding-bottom: 10px;
    }

    .title {
      font-size: 2rem;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 4px;
      animation: flicker 2s infinite;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    /* --- HACKER BUTTONS --- */
    .node-btn {
      background: transparent;
      border: 1px solid var(--glow-green);
      color: var(--glow-green);
      padding: 15px;
      font-family: var(--terminal-font);
      font-weight: bold;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .node-btn:hover {
      background: var(--glow-green);
      color: var(--bg-black);
      box-shadow: 0 0 15px var(--glow-green);
      transform: scale(1.05);
    }

    .node-btn::before {
      content: "[ ";
    }
    .node-btn::after {
      content: " ]";
    }

    /* --- ANIMATIONS --- */
    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.4; }
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="matrix-bg"></div>

  <!-- MAIN INTERFACE -->
  <main class="app-container" id="main-ui">
    <div class="terminal-window">
      <div class="header">
        <h1 class="title">> SYSTEM OVERRIDE: ACTIVE</h1>
        <p style="font-size: 0.8rem;">SECURE CONNECTION ESTABLISHED // PORT: 8080</p>
      </div>

      <section class="grid">
        <button class="node-btn" onclick="openGame('FNF', 'html5_build/index.html')">OPEN_FNF</button>
        <button class="node-btn" onclick="openGame('Dusttale', 'https://yf7kv9jmms-tech.github.io/kvifivivibioeowpd/')">OPEN_DUSTTALE</button>
        <button class="node-btn" onclick="openGame('FNAE', 'https://yf7kv9jmms-tech.github.io/lfjkvivospelfo/')">OPEN_FNAE</button>
        <button class="node-btn" onclick="openGame('Agoti', 'https://yf7kv9jmms-tech.github.io/agoti/')">OPEN_AGOTI</button>
        <button class="node-btn" onclick="openGame('FNAFS', 'https://yf7kv9jmms-tech.github.io/fnaf/')">OPEN_FNAFS</button>
        <button class="node-btn" onclick="openGame('Garcello', 'https://yf7kv9jmms-tech.github.io/garcello2/')">OPEN_GARCELLO</button>
        <button class="node-btn" onclick="openGame('Silly Billy', 'https://yf7kv9jmms-tech.github.io/silly-billy/')">OPEN_SILLYBILLY</button>
        <button class="node-btn" onclick="openGame('Eaglercraft', 'https://yf7kv9jmms-tech.github.io/eagler/')">OPEN_EAGLER</button>
        <button class="node-btn" onclick="openGame('Baldi', 'https://yf7kv9jmms-tech.github.io/baldi2/')">OPEN_BALDI</button>
      </section>

      <div style="margin-top: 20px; font-size: 0.7rem; opacity: 0.6;">
        [WARNING] ENSURE POPUP PERMISSIONS ARE GRANTED TO PREVENT LINK BREAKAGE.
      </div>
    </div>
  </main>

<script>
    /* --- CORE FUNCTIONALITY --- */
    function openGame(name, url) {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("ACCESS DENIED: ALLOW POPUPS FOR PROTOCOL INITIATION.");
        return;
      }

      // Hacker loading screen for the popup
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>about:blank</title>
          <style>
            body { background: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
            .loader { border: 2px solid #0f0; padding: 20px; box-shadow: 0 0 10px #0f0; }
            iframe { width: 100vw; height: 100vh; border: none; display: none; }
            .glitch { animation: flash 0.1s infinite; }
            @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
          </style>
        </head>
        <body>
          <div id="loading" class="loader glitch">TUNNELING TO ${name.toUpperCase()}... PLEASE WAIT.</div>
          <iframe id="game-frame" src="${url}"></iframe>
          <script>
            const frame = document.getElementById('game-frame');
            frame.onload = () => {
              document.getElementById('loading').style.display = 'none';
              frame.style.display = 'block';
            };
          <\/script>
        </body>
        </html>
      `);
    }
  </script>
</body>
</html>
